name: Build IPA from Xcode Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  APP_NAME: "FiveNightsAtPaws"

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build and Package Unsigned IPA via Xcode
        run: |
          xcodebuild clean build \
            -project "${APP_NAME}.xcodeproj" \
            -scheme "${APP_NAME}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/output"

          mkdir -p Payload
          cp -r output/*.app Payload/
          zip -qr "${APP_NAME}_unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-unsigned-ipa
          path: ${{ env.APP_NAME }}_unsigned.ipa
          retention-days: 7
